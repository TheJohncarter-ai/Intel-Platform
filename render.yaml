services:
  - type: web
    name: intel-platform-baze
    env: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm db:push && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/trpc/system.health?input=%7B%22json%22%3A%7B%22timestamp%22%3A0%7D%7D
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://thejohncarter-ai.github.io/Intel-Platform
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        value: Powelljohn9521@gmail.com
