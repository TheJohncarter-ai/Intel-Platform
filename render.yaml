services:
  - type: web
    name: intel-platform-api
    env: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm db:push && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/trpc/system.health?input=%7B%22json%22%3A%7B%22timestamp%22%3A0%7D%7D
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Set these in the Render dashboard under Environment:
      # JWT_SECRET           — random secret for signing session JWTs
      # DATABASE_URL         — MySQL/TiDB connection string
      # GOOGLE_CLIENT_ID     — Google OAuth client ID
      # GOOGLE_CLIENT_SECRET — Google OAuth client secret
      # ADMIN_EMAIL          — Google account email that gets admin role (default: Powelljohn9521@gmail.com)
      # FRONTEND_URL         — https://thejohncarter-ai.github.io/Intel-Platform
      # (RENDER_EXTERNAL_URL is set automatically by Render — used for the OAuth callback URI)
